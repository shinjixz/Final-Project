name: CI (Lint & Test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8 / PEP8)
        run: flake8

      - name: Unit tests + coverage
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Smoke test (batch mode, offline analyser)
        run: python main.py --offline --batch data/sample_batch.csv --output exports/ci_output.csv

      - name: Check web JavaScript syntax
        run: node --check web/app.js
